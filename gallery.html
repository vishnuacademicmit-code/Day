<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Memories Gallery</title>
    <link rel="stylesheet" href="style.css"> <!-- Base styles -->
    <link rel="stylesheet" href="gallery.css"> <!-- Specific gallery styles -->
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Reuse BG music if desired, or let it interrupt. 
         Usually nicer to keep music playing if SPA, but for multi-page, it restarts. 
         Let's just add the audio tag here too for continuity if they play it.
    -->

    <!-- Moon Phase -->
    <div class="moon"></div>
    <!-- Sky Atmosphere -->
    <div id="sky-container"></div>

    <div class="gallery-container">
        <h1 class="gallery-title">Memories ✨</h1>

        <div id="memory-stage">
            <!-- The Photo Frame -->
            <div id="current-polaroid" class="polaroid centered-polaroid">
                <img id="photo-img" src="" alt="Memory">
                <div id="photo-caption" class="caption"></div>
            </div>

            <!-- The Runner -->

        </div>

        <div id="loading-indicator">Loading Memories...</div>

        <div style="position: absolute; bottom: 30px; display: flex; gap: 20px; z-index: 100;">
            <a href="index.html" class="back-btn">← Back</a>
            <a href="message.html" class="back-btn">Next →</a>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bg-music" loop>
        <source src="music/song.mp3" type="audio/mpeg">
    </audio>

    <!-- Mute/Unmute Button -->
    <button id="mute-btn" class="mute-btn">🔊</button>

    <script src="gallery.js"></script>
</body>

</html>
